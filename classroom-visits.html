VIEWS.evaluations = function(){
  const evals = Model.evaluations();
  const visits = Model.visits().filter(v => STAGE_INDEX[Model.computeStage(v)] >= STAGE_INDEX.visited && v.status !== 'Cancelled');
  const completed = evals.filter(e => e.status === 'Completed').length;
  const pending = visits.filter(v => !Model.evalOfVisit(v.id)).length;
  const fbPending = visits.filter(v => !['Feedback Given','Email Sent','No Immediate Feedback Required'].includes(v.feedbackStatus)).length;
  const follows = Model.followUpItems();
  const f = state.filters, q = f.q.trim().toLowerCase();

  const rows = visits.filter(v => {
    const t = Model.teacher(v.teacherId);
    if(f.teacher && v.teacherId !== f.teacher) return false;
    if(q && !((t ? t.name : '') + ' ' + v.code).toLowerCase().includes(q)) return false;
    return true;
  }).sort((a,b) => a.date < b.date ? 1 : -1).map(v => {
    const t = Model.teacher(v.teacherId);
    const e = Model.evalOfVisit(v.id);
    const next = e ? ((e.nextStepsChecklist||[])[0] || ((e.actions||[])[0]||{}).action || '') : ((v.nextSteps||[])[0] || '');
    return '<tr class="row-mark ' + (e && e.status === 'Completed' ? 'm-ok' : 'm-warn') + '">' +
      '<td class="t-name"><button data-teacher="' + h(v.teacherId) + '">' + h(t ? t.name : '—') + '</button>' +
        '<span class="t-sub vcode">' + h(v.code) + '</span></td>' +
      '<td class="nowrap mono">' + fmtDate(v.date) + '</td>' +
      '<td>' + (e ? (e.status === 'Completed' ? '<span class="badge b-ok">Completed</span>' : '<span class="badge b-warn">Draft</span>')
                  : '<span class="badge b-mute">Not Started</span>') + '</td>' +
      '<td>' + badge(FEEDBACK, v.feedbackStatus) + '</td>' +
      '<td>' + (next ? '<span class="tag en">' + h(next) + '</span>' : '—') + '</td>' +
      '<td class="nowrap mono">' + (v.followUpDate ? fmtDate(v.followUpDate) : (e && e.followUpDate ? fmtDate(e.followUpDate) : '—')) + '</td>' +
      '<td>' + stageBadge(v) + '</td>' +
      '<td class="nowrap"><div class="actions">' +
        '<button class="btn sm primary" data-eval="' + h(v.id) + '">' + ICON.clipboard + ' ' + (e ? 'فتح التقييم' : 'تقييم الزيارة') + '</button>' +
        (e ? '<button class="iconbtn" data-evalprint="' + h(e.id) + '" title="طباعة التقييم">' + ICON.print + '</button>' : '') +
      '</div></td></tr>';
  }).join('');

  return '' +
  '<div class="page-head"><div class="page-title">التقييمات والمتابعة' +
    '<span class="sub en">Evaluation &amp; Follow-up Dashboard</span></div></div>' +
  '<div class="stat-grid" style="margin-bottom:14px">' +
    '<div class="stat acc"><div class="stat-label">تقييمات مكتملة<span class="en">Evaluations Completed</span></div><div class="stat-value mono">' + completed + '</div></div>' +
    '<div class="stat warn"><div class="stat-label">تقييمات معلّقة<span class="en">Evaluations Pending</span></div><div class="stat-value mono">' + pending + '</div></div>' +
    '<div class="stat warn"><div class="stat-label">تغذية راجعة معلّقة<span class="en">Feedback Pending</span></div><div class="stat-value mono">' + fbPending + '</div></div>' +
    '<div class="stat alert"><div class="stat-label">متابعات مطلوبة<span class="en">Follow-ups Required</span></div><div class="stat-value mono">' + follows.filter(x => x.status !== 'Completed').length + '</div></div>' +
    '<div class="stat"><div class="stat-label">متابعات منجزة<span class="en">Follow-ups Completed</span></div><div class="stat-value mono">' + follows.filter(x => x.status === 'Completed').length + '</div></div>' +
  '</div>' +
  '<div class="card"><div class="filters">' +
      '<div class="f"><label>بحث — Search</label><div class="search-box">' + ICON.search +
        '<input type="text" id="fq" placeholder="اسم المعلمة / رقم الزيارة" value="' + h(f.q) + '"></div></div>' +
      '<div class="f"><label>المعلمة — Teacher</label><select id="fteacher">' + teacherOptions(f.teacher) + '</select></div>' +
      '<button class="btn ghost sm" id="fclear">' + ICON.x + ' مسح</button>' +
    '</div><div class="card-body flush">' + (rows ?
      '<div class="tbl-wrap"><table class="tbl"><thead><tr>' +
        '<th>المعلمة<span class="en">Teacher</span></th><th>تاريخ الزيارة<span class="en">Visit Date</span></th>' +
        '<th>التقييم<span class="en">Evaluation</span></th><th>التغذية الراجعة<span class="en">Feedback</span></th>' +
        '<th>الخطوة التالية<span class="en">Next Step</span></th><th>تاريخ المتابعة<span class="en">Follow-up Date</span></th>' +
        '<th>الحالة<span class="en">Status</span></th><th></th></tr></thead><tbody>' + rows + '</tbody></table></div>'
      : emptyState('clipboard','لا توجد زيارات منفذة بعد','بعد تنفيذ الزيارة وتسجيلها يمكن فتح نموذج التقييم الصفي التطويري الخاص بها.',
          '<button class="btn primary" data-nav="daily">' + ICON.calendar + ' الزيارات اليومية</button>')) +
    '</div></div>';

VIEWS.evaluate = function(){
  const v = Model.visit(state.param);
  if(!v) return '<div class="card"><div class="card-body">' + emptyState('clipboard','الزيارة غير موجودة','',
    '<button class="btn primary" data-nav="evaluations">العودة</button>') + '</div></div>';
  const t = Model.teacher(v.teacherId);
  let e = Model.evalOfVisit(v.id);
  if(!e){ e = Model.blankEvaluation(v); Model.saveEvaluation(e); }
  const s = S();

  const headerCard = '<div class="card" style="margin-bottom:14px"><div class="card-body">' +
    '<div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:10px">' +
      '<div><b style="font-size:15px">' + h(t ? t.name : '—') + '</b>' +
        '<span style="font-size:11.5px;color:var(--ink-3)"> · ' + h(v.subject || '—') + '</span></div>' +
      '<span class="vcode lg">' + h(v.code) + '</span></div>' +
    '<div class="kv">' +
      '<div><div class="k en">Teacher Name</div><div class="v">' + h(t ? t.name : '—') + '</div></div>' +
      '<div><div class="k en">Subject</div><div class="v">' + h(v.subject || '—') + '</div></div>' +
      '<div><div class="k en">Grade / Class</div><div class="v mono">' + h(v.grade ? v.grade + '/' + v.cls : '—') + '</div></div>' +
      '<div><div class="k en">Date</div><div class="v mono">' + fmtDate(v.date) + '</div></div>' +
      '<div><div class="k en">Period</div><div class="v mono">' + h(v.period || '—') + '</div></div>' +
      '<div><div class="k en">Lesson Topic</div><div class="v">' + h(v.topic || '—') + '</div></div>' +
      '<div><div class="k en">Visit Type</div><div class="v en">' + h(v.type) + '</div></div>' +
      '<div><div class="k en">Duration</div><div class="v mono">' + h(v.duration || '—') + ' min</div></div>' +
      '<div><div class="k en">Observer</div><div class="v">' + h(e.observer || s.observer) + '</div></div>' +
      '<div style="grid-column:1/-1"><div class="k en">Focus of Visit</div><div class="v">' +
        ((v.focus||[]).length ? v.focus.map(f => '<span class="tag en">' + h(f) + '</span> ').join('') : '—') + '</div></div>' +
    '</div></div></div>';

  const domainAcc = DOMAINS.map((d, i) => {
    const dv = e.domains[d.id] || {rating:'', evidence:'', items:{}};
    const inner =
      '<div class="crit">' + d.items.map((it, k) => {
        const cur = (dv.items && dv.items[k]) || '';
        return '<div class="crit-row"><div class="txt en">' + h(it) + '</div>' +
          '<div class="rating" data-item="' + d.id + '|' + k + '">' + RATINGS.map(rt =>
            '<label class="' + (cur === rt[0] ? 'on' : '') + '" data-lv="' + rt[2] + '" title="' + h(rt[1]) + '">' +
              '<input type="radio" name="it_' + d.id + '_' + k + '" value="' + h(rt[0]) + '"' + (cur === rt[0] ? ' checked' : '') + '>' +
              '<span class="en">' + h(rt[0]) + '</span></label>').join('') + '</div></div>';
      }).join('') + '</div>' +
      '<div class="field"><label>التقدير العام للمجال<span class="en"> Overall Domain Rating</span></label>' +
        '<div class="rating" data-domain="' + d.id + '">' + RATINGS.map(rt =>
          '<label class="' + (dv.rating === rt[0] ? 'on' : '') + '" data-lv="' + rt[2] + '" title="' + h(rt[1]) + '">' +
            '<input type="radio" name="dom_' + d.id + '" value="' + h(rt[0]) + '"' + (dv.rating === rt[0] ? ' checked' : '') + '>' +
            '<span class="en">' + h(rt[0]) + ' — ' + h(rt[1]) + '</span></label>').join('') + '</div></div>' +
      '<div class="field" style="margin-top:12px"><label>الأدلة الملاحظة<span class="en"> Evidence Observed</span></label>' +
        '<textarea data-evidence="' + d.id + '" placeholder="ما الذي شوهد فعليًا في الحصة ويدعم هذا التقدير…">' + h(dv.evidence) + '</textarea></div>';
    return accSection('d_' + d.id, i+1, d.ar, d.en, inner, state.accOpen['d_' + d.id]);
  }).join('');

  const actionsRows = (e.actions||[]).map((a, i) =>
    '<tr data-arow="' + i + '">' +
      '<td><input type="text" data-af="action" value="' + h(a.action) + '" placeholder="الإجراء المتفق عليه"></td>' +
      '<td><input type="text" data-af="responsible" value="' + h(a.responsible) + '" placeholder="المسؤول"></td>' +
      '<td><input type="date" data-af="deadline" value="' + h(a.deadline) + '"></td>' +
      '<td><input type="date" data-af="followUpDate" value="' + h(a.followUpDate) + '"></td>' +
      '<td><select data-af="status">' + optionList([['Not Started','Not Started'],['In Progress','In Progress'],['Completed','Completed']], a.status || 'Not Started') + '</select></td>' +
      '<td class="nowrap"><button class="iconbtn" data-adel="' + i + '">' + ICON.trash + '</button></td></tr>').join('');

  const summary = evaluationSummary(e);

  return '' +
  '<div class="page-head"><div class="page-title">نموذج تقييم الزيارة الصفية' +
    '<span class="sub en">Classroom Visit Evaluation Form — developmental, evidence-based, supportive</span></div>' +
    '<div class="page-actions">' +
      '<button class="btn" data-nav="evaluations">' + ICON.clipboard + ' التقييمات</button>' +
      '<button class="btn" id="evOpenVisit">' + ICON.eye + ' سجل الزيارة</button>' +
      '<button class="btn" id="evPrint">' + ICON.print + ' طباعة التقييم</button>' +
      '<button class="btn" id="evPdf">' + ICON.pdf + ' تصدير PDF</button>' +
      '<button class="btn primary" id="evSave">' + ICON.check + ' حفظ التقييم</button>' +
    '</div></div>' +

function evaluationSummary(e){
  const strong = [], dev = [];
  DOMAINS.forEach(d => {
    const r = (e.domains[d.id]||{}).rating;
    if(r === 'Highly Effective' || r === 'Effective') strong.push(d.en);
    if(r === 'Developing' || r === 'Requires Support') dev.push(d.en);
  });
  const key = (e.nextStepsChecklist||[])[0] || ((e.actions||[])[0]||{}).action || '—';
  return '<div class="kv">' +
    '<div><div class="k en">Strongest Areas</div><div class="v">' + (strong.length ? strong.map(x => '<span class="tag en">' + h(x) + '</span> ').join('') : '—') + '</div></div>' +
    '<div><div class="k en">Development Areas</div><div class="v">' + (dev.length ? dev.map(x => '<span class="tag en">' + h(x) + '</span> ').join('') : '—') + '</div></div>' +
    '<div><div class="k en">Key Next Step</div><div class="v en">' + h(key) + '</div></div>' +
    '<div><div class="k en">Follow-up Required</div><div class="v en">' + h(e.followUpRequired || 'No') + '</div></div>' +
    '<div><div class="k en">Follow-up Date</div><div class="v mono">' + (e.followUpDate ? fmtDate(e.followUpDate) : '—') + '</div></div>' +
    '<div><div class="k en">Evaluation Status</div><div class="v en">' + h(e.status) + '</div></div>' +
    '</div>';
}

VIEWS.after_evaluate = function(){
  const v = Model.visit(state.param); if(!v) return;
  const e = Model.evalOfVisit(v.id); if(!e) return;
  bindAcc(); bindChips();

  /* rating segmented controls */
  $$('#view .rating').forEach(group => {
    $$('label', group).forEach(lb => {
      lb.onclick = () => { $$('label', group).forEach(x => x.classList.remove('on')); lb.classList.add('on'); };
    });
  });

  $('#addStrength').onclick = () => {
    const box = $('#strengthsBox'); const i = $$('.strength', box).length + 1;
    if(i > 6) return toast('الحد الأقصى 6 نقاط');
    box.insertAdjacentHTML('beforeend', '<div class="line-item"><div class="n mono">' + i + '</div><input type="text" class="strength" placeholder="دليل ملاحظ على نقطة قوة"></div>');
  };
  $('#addDev').onclick = () => {
    const box = $('#devBox'); const i = $$('.devitem', box).length + 1;
    if(i > 6) return toast('الحد الأقصى 6 نقاط');
    box.insertAdjacentHTML('beforeend', '<div class="line-item"><div class="n mono">' + i + '</div><input type="text" class="devitem" placeholder="فرصة للتطوير مدعومة بدليل"></div>');
  };
  const bindDel = () => $$('#actionsBody [data-adel]').forEach(b => b.onclick = () => { b.closest('tr').remove(); });
  $('#addAction').onclick = () => {
    const body = $('#actionsBody');
    const i = $$('tr', body).length;
    body.insertAdjacentHTML('beforeend',
      '<tr data-arow="' + i + '"><td><input type="text" data-af="action" placeholder="الإجراء المتفق عليه"></td>' +
      '<td><input type="text" data-af="responsible" value="' + h(S().observer) + '"></td>' +
      '<td><input type="date" data-af="deadline"></td><td><input type="date" data-af="followUpDate"></td>' +
      '<td><select data-af="status">' + optionList([['Not Started','Not Started'],['In Progress','In Progress'],['Completed','Completed']], 'Not Started') + '</select></td>' +
      '<td class="nowrap"><button class="iconbtn" data-adel="' + i + '">' + ICON.trash + '</button></td></tr>');
    bindDel();
  };
  bindDel();

  const fr = $('#evFollowReq');
  fr.onchange = () => { $('#followFields').style.display = fr.value === 'Yes' ? '' : 'none'; };

  const collect = () => {
    DOMAINS.forEach(d => {
      const dv = e.domains[d.id] || (e.domains[d.id] = {rating:'', evidence:'', items:{}});
      const dg = $('[data-domain="' + d.id + '"] input:checked');
      dv.rating = dg ? dg.value : '';
      const ta = $('[data-evidence="' + d.id + '"]');
      dv.evidence = ta ? ta.value.trim() : '';
      dv.items = {};
      d.items.forEach((_, k) => {
        const sel = $('[data-item="' + d.id + '|' + k + '"] input:checked');
        if(sel) dv.items[k] = sel.value;
      });
    });
    e.strengths = $$('.strength').map(i => i.value.trim()).filter(Boolean);
    e.development = $$('.devitem').map(i => i.value.trim()).filter(Boolean);
    e.nextStepsChecklist = readChips(document, 'nextchk');
    e.actions = $$('#actionsBody tr').map(tr => ({
      action: $('[data-af="action"]', tr).value.trim(),
      responsible: $('[data-af="responsible"]', tr).value.trim(),
      deadline: $('[data-af="deadline"]', tr).value,
      followUpDate: $('[data-af="followUpDate"]', tr).value,
      status: $('[data-af="status"]', tr).value,
    })).filter(a => a.action);
    e.observerComments = $('#evObserver').value.trim();
    e.teacherReflection = $('#evReflection').value.trim();
    e.followUpRequired = $('#evFollowReq').value;
    e.followUpDate = $('#evFollowDate').value;
    e.followUpFocus = $('#evFollowFocus').value.trim();
    e.followUpPerson = $('#evFollowPerson').value.trim();
    e.status = $('#evStatus').value;
  };
  const save = (silent) => {
    collect();
    Model.saveEvaluation(e);
    /* keep the visit record in step with the evaluation */
    const vv = Model.visit(v.id);
    if(vv){
      if(e.followUpRequired === 'Yes'){
        if(vv.followUp === 'No Follow-up') vv.followUp = 'Follow-up Required';
        if(e.followUpDate) vv.followUpDate = e.followUpDate;
        if(e.followUpFocus) vv.followUpFocus = e.followUpFocus;
        if(e.followUpPerson) vv.followUpPerson = e.followUpPerson;
      }
      if(e.status === 'Completed' && vv.feedbackStatus === 'Feedback Pending') vv.feedbackStatus = 'Feedback Given';
      Model.saveVisit(vv);
    }
    $('#summaryCard').innerHTML = '<div class="card-body">' + evaluationSummary(e) + '</div>';
    if(!silent) toast('تم حفظ التقييم', 'ok');
    renderNav();
  };
  $('#evSave').onclick = () => save();
  $('#evSave2').onclick = () => save();
  $('#evPrint').onclick = () => { save(true); printEvaluation(e.id); };
  $('#evPrint2').onclick = () => { save(true); printEvaluation(e.id); };
  $('#evPdf').onclick = () => { save(true); toast('اختاري "Save as PDF" من نافذة الطباعة'); printEvaluation(e.id); };
  $('#evOpenVisit').onclick = () => openVisitRecord(v.id);
  $('#evDel').onclick = () => confirmDialog('حذف التقييم', 'سيتم حذف نموذج التقييم الخاص بهذه الزيارة. سجل الزيارة نفسه لن يُحذف.',
    () => { Model.deleteEvaluation(e.id); toast('تم حذف التقييم'); go('evaluations'); });
};

      '<table class="pr-tbl"><tbody>' +
      d.items.map((it, k) => '<tr><td style="width:68%">' + h(it) + '</td><td>' + h((dv.items||{})[k] || '—') + '</td></tr>').join('') +

      '<div class="pr-box" style="min-height:20px">' + h(dv.evidence || '—') + '</div></div></div>';
  }).join('');
  const actions = (e.actions||[]).length
    ? '<table class="pr-tbl"><thead><tr><th>Action</th><th>Responsible</th><th>Deadline</th><th>Follow-up Date</th><th>Status</th></tr></thead><tbody>' +
      e.actions.map(a => '<tr><td>' + h(a.action) + '</td><td>' + h(a.responsible || '—') + '</td><td class="mono">' + (a.deadline ? fmtDate(a.deadline) : '—') +
        '</td><td class="mono">' + (a.followUpDate ? fmtDate(a.followUpDate) : '—') + '</td><td>' + h(a.status || 'Not Started') + '</td></tr>').join('') +
      '</tbody></table>'
    : '<div class="pr-box">—</div>';
  const strong = [], dev = [];
  DOMAINS.forEach(d => { const r = (e.domains[d.id]||{}).rating;

  doPrint('portrait', '<div class="pr-sheet">' +
    printHeader('نموذج تقييم الزيارة الصفية', 'Classroom Visit Evaluation Form',
      ['<span class="pr-idbox"><span class="en">Visit ID:</span> <b>' + h(v.code || '—') + '</b></span>',
       '<span class="en">Teacher:</span> <b>' + h(t ? t.name : '—') + '</b>',
       '<span class="en">Date:</span> <b>' + h(fmtDate(e.date)) + '</b>',
       '<span class="en">Observer:</span> <b>' + h(e.observer) + '</b>']) +
    '<div class="pr-sec"><h4>Visit Information</h4><div class="pr-fields">' +
      fld('Teacher Name', t ? t.name : '') + fld('Subject', v.subject) +
      fld('Grade / Class', v.grade ? v.grade + ' / ' + v.cls : '', false, true) + fld('Date', fmtDate(e.date), false, true) +
      fld('Period', v.period, false, true) + fld('Duration', v.duration ? v.duration + ' min' : '', false, true) +
      fld('Visit Type', v.type, false, true) + fld('Observer', e.observer) +
      fld('Lesson Topic', v.topic, true) +
      fld('Focus of Visit', (v.focus||[]).join(', '), true) +
    '</div></div>' +
    domains +
    '<div class="pr-sec"><h4>Key Strengths — نقاط القوة</h4><div class="pr-box">' +
      ((e.strengths||[]).filter(Boolean).map((x,i) => (i+1) + '. ' + x).join('\n') || '—') + '</div></div>' +
    '<div class="pr-sec"><h4>Areas for Development — مجالات التطوير</h4><div class="pr-box">' +

VIEWS.followup = function(){
  const items = Model.followUpItems();
  const f = state.filters, q = f.q.trim().toLowerCase();
  const shown = items.filter(x => {
    const t = Model.teacher(x.teacherId);
    if(f.teacher && x.teacherId !== f.teacher) return false;
    if(f.status && x.status !== f.status) return false;
    if(q && !((t ? t.name : '') + ' ' + x.action).toLowerCase().includes(q)) return false;
    return true;
  });
  const kindLabel = {visit:['b-info','Visit Follow-up'], admin:['b-warn','Administration Action'], eval:['b-olive','Agreed Next Step']};
  const overdue = x => x.deadline && x.deadline < todayISO() && x.status !== 'Completed';

  const rows = shown.map(x => {
    const t = Model.teacher(x.teacherId);
    const k = kindLabel[x.kind];
    return '<tr class="row-mark ' + (x.status === 'Completed' ? 'm-ok' : overdue(x) ? 'm-alert' : 'm-warn') + '">' +
      '<td class="t-name"><button data-teacher="' + h(x.teacherId) + '">' + h(t ? t.name : '—') + '</button>' +
        (x.visit ? '<span class="t-sub vcode">' + h(x.visit.code) + '</span>' : '') + '</td>' +
      '<td><span class="badge ' + k[0] + '"><span class="en">' + k[1] + '</span></span></td>' +
      '<td>' + h(x.action) + '</td>' +
      '<td>' + h(x.responsible || '—') + '</td>' +
      '<td class="nowrap mono">' + (x.deadline ? fmtDate(x.deadline) + (overdue(x) ? ' <span class="badge b-alert plain">متأخر</span>' : '') : '—') + '</td>' +
      '<td class="nowrap mono">' + (x.followUpDate ? fmtDate(x.followUpDate) : (x.visit && x.visit.followUpDate ? fmtDate(x.visit.followUpDate) : '—')) + '</td>' +
      '<td class="nowrap"><select class="fuStatus" data-item="' + h(x.id) + '" style="min-width:130px">' +
        optionList([['Not Started','Not Started'],['In Progress','In Progress'],['Completed','Completed']], x.status) + '</select></td>' +
      '<td class="nowrap"><div class="actions">' +
        (x.visit ? '<button class="iconbtn" data-open="' + h(x.visit.id) + '" title="فتح سجل الزيارة">' + ICON.eye + '</button>' : '') +
        (x.kind === 'visit' && x.visit ? '<button class="iconbtn" data-revisit="' + h(x.visit.id) + '" title="إنشاء زيارة متابعة">' + ICON.plus + '</button>' : '') +
      '</div></td></tr>';
  }).join('');

  return '' +
  '<div class="page-head"><div class="page-title">المتابعة والإجراءات' +
    '<span class="sub en">Follow-up — visit follow-ups, administration actions and agreed next steps</span></div>' +

  '<div class="stat-grid" style="margin-bottom:14px">' +
    '<div class="stat alert"><div class="stat-label">إجراءات مفتوحة<span class="en">Open Actions</span></div><div class="stat-value mono">' + items.filter(x => x.status !== 'Completed').length + '</div></div>' +
    '<div class="stat warn"><div class="stat-label">متأخرة عن الموعد<span class="en">Overdue</span></div><div class="stat-value mono">' + items.filter(overdue).length + '</div></div>' +
    '<div class="stat acc"><div class="stat-label">مكتملة<span class="en">Completed</span></div><div class="stat-value mono">' + items.filter(x => x.status === 'Completed').length + '</div></div>' +

  '</div>' +

VIEWS.after_followup = function(){
  const f = state.filters;
  const q = $('#fq'); if(q) q.oninput = () => { f.q = q.value; const p = q.selectionStart; render(); const n = $('#fq'); if(n){ n.focus(); n.setSelectionRange(p,p); } };
  const ft = $('#fteacher'); if(ft) ft.onchange = () => { f.teacher = ft.value; render(); };
  const fs = $('#fstatus'); if(fs) fs.onchange = () => { f.status = fs.value; render(); };
  const fc = $('#fclear'); if(fc) fc.onclick = () => { f.q = ''; f.teacher = ''; f.status = ''; render(); };
  $$('#view [data-teacher]').forEach(b => b.onclick = () => go('teacher', b.dataset.teacher));
  $$('#view [data-open]').forEach(b => b.onclick = () => openVisitRecord(b.dataset.open));
  $$('#view [data-revisit]').forEach(b => b.onclick = () => {
    const src = Model.visit(b.dataset.revisit); if(!src) return;
    const v = Model.blankVisit(src.followUpDate || todayISO());
    v.teacherId = src.teacherId; v.subject = src.subject; v.grade = src.grade; v.cls = src.cls;
    v.type = 'Follow-up Visit'; v.focus = src.focus.slice();
    v.purpose = 'متابعة الزيارة ' + src.code + (src.followUpFocus ? ' — ' + src.followUpFocus : '');
    Model.saveVisit(v);
    toast('تم إنشاء زيارة المتابعة ' + v.code, 'ok');
    state.date = v.date; go('daily');
  });
  $$('#view .fuStatus').forEach(sel => sel.onchange = () => {
    const [base, tail] = sel.dataset.item.split('#');
    if(tail === 'admin' || !tail){
      const v = Model.visit(base);
      if(v){
        if(tail === 'admin'){ v.admin.status = sel.value; }
        else { v.closedAt = sel.value === 'Completed' ? (v.closedAt || nowISO()) : ''; if(v.admin) v.admin.status = sel.value; }
        Model.saveVisit(v);
      }
    } else {
      const e = Model.evaluation(base);
      if(e && e.actions[Number(tail)]){ e.actions[Number(tail)].status = sel.value; Model.saveEvaluation(e); }
    }
    toast('تم تحديث الحالة', 'ok'); render();
  });
  $('#fuPrint').onclick = printFollowUpList;
};

/* ── CSV export ── */
function downloadFile(name, content, mime){
  const blob = new Blob(['﻿' + content], {type: (mime || 'text/csv') + ';charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { a.remove(); URL.revokeObjectURL(url); }, 400);
}
function exportVisitsCSV(){
  const head = ['Visit ID','Date','Day','Teacher','Subject','Grade','Class','Period','Lesson Topic','Visit Type',
    'Start Time','Duration','Status','Stage','Feedback','Follow-up','Follow-up Date','Focus','Evidence',
    'Strengths','Development','Administration Note','Required Action','Responsible','Deadline','Action Status','Notes'];
  const rows = Model.visits().sort((a,b) => a.date < b.date ? -1 : 1).map(v => {
    const t = Model.teacher(v.teacherId);
    return [v.code, v.date, DOW_EN[dowOf(v.date)], t ? t.name : '', v.subject, v.grade, v.cls, v.period, v.topic, v.type,
      v.startTime, v.duration, v.status, Model.stageLabel(v).en, v.feedbackStatus, v.followUp, v.followUpDate,
      (v.focus||[]).join(' | '), v.evidence, v.strengths, v.development,
      v.admin && v.admin.current, v.admin && v.admin.action, v.admin && v.admin.responsible,
      v.admin && v.admin.deadline, v.admin && v.admin.status, v.notes].map(csvCell).join(',');
  });
  downloadFile('muraijib-visits-' + todayISO() + '.csv', [head.join(','), ...rows].join('\n'));
  toast('تم تصدير ملف الزيارات', 'ok');
}
function exportWeeklyCSV(){
  const dates = new Set(Model.activeDates());
  const head = ['Teacher','Subject','Total Visits','Completed','Last Visit Date','Last Visit Type','Feedback Completed','Follow-up Required','Next Planned Visit'];
  const rows = Model.activeTeachers().map(t => {
    const vs = Model.visitsOfTeacher(t.id).filter(v => dates.has(v.date) && v.status !== 'Cancelled');
    const done = vs.filter(v => STAGE_INDEX[Model.computeStage(v)] >= STAGE_INDEX.visited);
    const last = done[0];
    const next = vs.filter(v => v.status === 'Planned' && v.date >= todayISO()).sort((a,b) => a.date < b.date ? -1 : 1)[0];
    const fb = done.filter(v => ['Feedback Given','Email Sent','No Immediate Feedback Required'].includes(v.feedbackStatus)).length;
    const fu = vs.find(v => v.followUp && v.followUp !== 'No Follow-up');
    return [t.name, t.subject, vs.length, done.length, last ? last.date : '', last ? last.type : '',
      fb + '/' + done.length, fu ? fu.followUp : 'No Follow-up', next ? next.date : ''].map(csvCell).join(',');
  });
  downloadFile('muraijib-weekly-coverage-' + todayISO() + '.csv', [head.join(','), ...rows].join('\n'));
  toast('تم تصدير ملف التغطية', 'ok');
}

      '<div class="field"><label>الصفوف<span class="en"> Grades</span></label><textarea id="stGrades" style="min-height:90px">' + h(s.grades.join('\n')) + '</textarea></div>' +
      '<div class="field"><label>الشعب<span class="en"> Classes</span></label><textarea id="stClasses" style="min-height:90px">' + h(s.classes.join('\n')) + '</textarea></div>' +
    '</div>', false) +

  accSection('st_data','6','إدارة البيانات','Data Management — local storage & future sync',
    '<div class="note" style="margin-bottom:12px">' + ICON.info +
      ' تُحفظ البيانات في المتصفح (Local Storage) بهيكل جاهز للربط لاحقًا مع Firebase أو Supabase أو Microsoft OneDrive دون إعادة بناء النظام:' +
      ' <span class="en">teachers · visits · evaluations · settings</span>.</div>' +
    '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
      '<button class="btn" id="stExport">' + ICON.download + ' تصدير نسخة احتياطية (JSON)</button>' +
      '<button class="btn" id="stImportBtn">' + ICON.upload + ' استعادة نسخة احتياطية</button>' +
      '<input type="file" id="stImport" accept="application/json" class="hidden">' +
      '<button class="btn" id="stCsv">' + ICON.download + ' تصدير الزيارات CSV</button>' +
      '<button class="btn" id="stDemo">' + ICON.users + ' تحميل بيانات تجريبية</button>' +
      '<button class="btn danger" id="stReset">' + ICON.trash + ' حذف جميع البيانات</button>' +
    '</div>' +
    '<div class="kv" style="margin-top:14px">' +
      '<div><div class="k en">Teachers</div><div class="v mono">' + DB().teachers.length + '</div></div>' +
      '<div><div class="k en">Visits</div><div class="v mono">' + DB().visits.length + '</div></div>' +
      '<div><div class="k en">Evaluations</div><div class="v mono">' + DB().evaluations.length + '</div></div>' +
      '<div><div class="k en">Last Saved</div><div class="v mono ltr">' + h((DB().meta.updatedAt||'').slice(0,16).replace('T',' ')) + '</div></div>' +
    '</div>', false);
};

function logoSlot(key, ar, en, preview, custom){
  return '<div class="logo-slot">' +
    '<div class="logo-slot-h"><b>' + h(ar) + '</b><span class="en">' + h(en) + '</span>' +
      (custom ? '<span class="badge b-ok plain">ملف مرفوع</span>' : '<span class="badge b-mute plain">رسم مضمّن</span>') + '</div>' +
    '<div class="logo-slot-p">' + preview + '</div>' +
    '<div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">' +
      '<input type="file" id="stLogo_' + key + '" accept="image/*" style="max-width:210px;font-size:11px">' +
      (custom ? '<button class="btn sm danger" id="stLogoDel_' + key + '">' + ICON.trash + ' إزالة</button>' : '') +
    '</div></div>';
}

VIEWS.after_settings = function(){
  bindAcc();
  const s = S();

  $$('#view [data-actterm]').forEach(b => b.onclick = () => { s.activeTermId = b.dataset.actterm; Store.save(); toast('تم تفعيل الفصل', 'ok'); render(); });
  $$('#view [data-delterm]').forEach(b => b.onclick = () => {
    if(s.terms.length <= 1) return toast('يجب الإبقاء على فصل واحد على الأقل', 'err');
    s.terms = s.terms.filter(t => t.id !== b.dataset.delterm);
    if(s.activeTermId === b.dataset.delterm) s.activeTermId = s.terms[0].id;
    Store.save(); render();
  });
  $('#stAddTerm').onclick = () => {
    s.terms.push({id: uid('term'), name:'فصل جديد', start: todayISO(), end: addDays(todayISO(), 90)});
    Store.save(); render();
  };
  [['moe','logo'],['charter','logoCharter']].forEach(([key, field]) => {
    const inp = $('#stLogo_' + key);
    if(inp) inp.onchange = () => {
      const file = inp.files[0]; if(!file) return;
      if(file.size > 500000) return toast('حجم الصورة كبير — استخدمي صورة أقل من 500KB', 'err');
      const fr = new FileReader();
      fr.onload = () => { s[field] = fr.result; Store.save(); toast('تم رفع الشعار', 'ok'); render(); };
      fr.onerror = () => toast('تعذّرت قراءة الملف', 'err');
      fr.readAsDataURL(file);
    };
    const del = $('#stLogoDel_' + key);
    if(del) del.onclick = () => { s[field] = ''; Store.save(); toast('تمت العودة إلى الرسم المضمّن'); render(); };
  });

  $('#stSave').onclick = () => {
    s.academicYear = $('#stYear').value.trim() || s.academicYear;
    s.schoolNameAr = $('#stSchoolAr').value.trim() || s.schoolNameAr;
    s.schoolNameEn = $('#stSchoolEn').value.trim() || s.schoolNameEn;
    s.cycleAr = $('#stCycleAr').value.trim();
    s.cycleEn = $('#stCycleEn').value.trim();
    s.schoolCode = $('#stSchoolCode').value.trim();
    s.principal = $('#stPrincipal').value.trim();
    s.observer = $('#stObserver').value.trim();
    s.observerEn = $('#stObserverEn').value.trim();
    s.defaultDuration = Number($('#stDuration').value) || 20;
    s.windowStart = $('#stWinStart').value || s.windowStart;
    s.windowEnd = $('#stWinEnd').value || s.windowEnd;
    s.workingDays = $$('.wday:checked').map(c => Number(c.value));
    if(!s.workingDays.length) s.workingDays = [1,2,3,4,5];
    const enabled = $$('.wdate:checked').map(c => c.value);
    s.disabledDates = Model.windowDates().filter(d => !enabled.includes(d));
    s.periods = Math.max(1, Math.min(12, Number($('#stPeriods').value) || 8));
    const pt = {};
    $$('[data-ptime]').forEach(i => { if(i.value) pt[i.dataset.ptime] = i.value; });
    s.periodTimes = Object.assign({}, s.periodTimes, pt);
    const lines = id => $('#' + id).value.split('\n').map(x => x.trim()).filter(Boolean);
    s.subjects = lines('stSubjects'); s.visitTypes = lines('stTypes');
    s.grades = lines('stGrades'); s.classes = lines('stClasses');
    $$('[data-term]').forEach(i => {
      const [id, field] = i.dataset.term.split('|');
      const t = s.terms.find(x => x.id === id);
      if(t) t[field] = i.value;
    });
    Store.save();
    state.date = '';
    toast('تم حفظ الإعدادات', 'ok');
    render();
  };

  $('#stExport').onclick = () => {
    downloadFile('muraijib-cvms-backup-' + todayISO() + '.json', JSON.stringify(Store.export(), null, 2), 'application/json');
    toast('تم إنشاء النسخة الاحتياطية', 'ok');
  };
  $('#stImportBtn').onclick = () => $('#stImport').click();
  $('#stImport').onchange = () => {
    const file = $('#stImport').files[0]; if(!file) return;
    const fr = new FileReader();
    fr.onload = () => {
      try{
        const obj = JSON.parse(fr.result);
        confirmDialog('استعادة نسخة احتياطية', 'سيتم استبدال جميع البيانات الحالية ببيانات الملف. هل ترغبين بالمتابعة؟',
          () => { Store.import(obj); toast('تمت الاستعادة', 'ok'); state.date = ''; render(); }, 'استعادة');
      }catch(e){ toast('ملف غير صالح', 'err'); }
    };
    fr.readAsText(file);
  };
  $('#stCsv').onclick = exportVisitsCSV;
  $('#stDemo').onclick = loadDemoData;
  $('#stReset').onclick = () => confirmDialog('حذف جميع البيانات',
    'سيتم حذف جميع المعلمات والزيارات والتقييمات والإعدادات نهائيًا من هذا الجهاز. يُنصح بتصدير نسخة احتياطية أولًا.',
    () => { Store.reset(); state.date = ''; toast('تم حذف البيانات'); go('dashboard'); render(); });
};

/* ═══════════════════════════════════════════════════════════════
   DEMO DATA  (optional starter set — safe to clear)
   ═══════════════════════════════════════════════════════════════ */
function loadDemoData(){
  confirmDialog('تحميل بيانات تجريبية',
    'سيتم إضافة 8 معلمات بجداول حصص ونماذج زيارات لغرض التجربة. يمكن حذفها لاحقًا من إعدادات إدارة البيانات.',
    () => {
      const demo = [
        ['فاطمة الكعبي','Fatima Al Kaabi','English',['6','7'],['1','2','4','5']],
        ['مريم البلوشي','Maryam Al Balushi','Science',['7','8'],['1','3','4']],
        ['عائشة النعيمي','Aisha Al Nuaimi','Mathematics',['5','6'],['2','3','5']],
        ['نورة الشامسي','Noura Al Shamsi','Arabic',['7','8'],['1','2','6']],
        ['هند المنصوري','Hind Al Mansouri','Islamic Education',['5','8'],['3','4']],
        ['سارة الظاهري','Sara Al Dhaheri','Social Studies',['6','7'],['2','5']],
        ['أمل الحمادي','Amal Al Hammadi','Design & Technology',['5','6','7'],['1','6']],
        ['شيخة الزعابي','Shaikha Al Zaabi','Moral Education',['8'],['1','2','3']],
      ];
      const created = [];
      demo.forEach((d, idx) => {
        const t = Model.blankTeacher();
        t.name = d[0]; t.nameEn = d[1]; t.subject = d[2]; t.grades = d[3]; t.classes = d[4];
        const tt = {};
        [1,2,3,4,5].forEach((day, di) => {
          tt[String(day)] = [];
          for(let k = 0; k < 3; k++){
            const period = String(((idx + di + k*3) % 7) + 1);
            tt[String(day)].push({period, grade: d[3][k % d[3].length], cls: d[4][(k+di) % d[4].length], subject: d[2]});
          }
          tt[String(day)].sort((a,b) => Number(a.period) - Number(b.period));
        });
        t.timetable = tt;
        Model.saveTeacher(t);
        created.push(t);
      });
      /* two illustrative visits on the first working day */
      const dates = Model.activeDates();
      if(dates.length && created.length >= 2){
        const d0 = dates[0];
        [[0,'Learning Walk'],[1,'Teaching & Learning Visit']].forEach(([i, type]) => {
          const t = created[i];
          const slot = Model.slotsFor(t.id, d0)[0];
          const v = Model.blankVisit(d0);
          v.teacherId = t.id; v.subject = t.subject; v.type = type;
          if(slot){ v.period = slot.period; v.grade = slot.grade; v.cls = slot.cls; v.startTime = S().periodTimes[slot.period] || ''; }
          v.focus = ['Student Engagement','Questioning Techniques'];
          v.purpose = 'متابعة استراتيجيات التعلم النشط.';
          Model.saveVisit(v);
        });
      }
      toast('تم تحميل البيانات التجريبية', 'ok');
      state.date = '';
      go('teachers'); render();
    }, 'تحميل');
}
